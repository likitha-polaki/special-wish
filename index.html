<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Akka</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }

    .text-box {
      font-size: 1.5rem;
      line-height: 1.8;
      min-height: 150px;
      margin-bottom: 20px;
    }

    .highlight {
      color: #38bdf8;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1.8rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .final-wish {
      font-size: 2.2rem;
      color: #f43f5e;
      font-weight: 800;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
    }

    .final-wish.show {
      opacity: 1;
      transform: scale(1);
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="textDisplay" class="text-box">Click start to play the message...</div>
    <div id="finalWish" class="final-wish">Once again, Happy Birthday Akka! 🎉🎂</div>
    <br>
    <button class="btn" onclick="startAnimation()">Play Message</button>
  </div>

  <script>
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function startAnimation() {
      const display = document.getElementById("textDisplay");
      const finalWish = document.getElementById("finalWish");

      // Reset
      display.innerHTML = "";
      finalWish.classList.remove("show");

      // Line 1
      display.innerHTML = "Oka kathani modalupettadam andharu chestharu... kaani dhaanni ";
      await sleep(2000);

      // 'Perfect' highlight 1
      display.innerHTML += "<span class='highlight'>PERFECT</span> ";
      await sleep(1000);

      display.innerHTML += "ga muginchadame kondharike saadhyam. <br><br>";
      await sleep(2000);

      // Line 2
      display.innerHTML += "Alaa prathee vishayamlo ";
      await sleep(1200);

      // 'Perfect' highlight 2
      display.innerHTML += "<span class='highlight'>PERFECT</span> ";
      await sleep(1000);

      display.innerHTML += "ga unde maa akkaki...<br>";
      await sleep(2000);

      // Final Birthday Wish Reveal
      finalWish.classList.add("show");
    }
  </script>

</body>
</html>
