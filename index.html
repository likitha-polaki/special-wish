<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kavya Mam!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background-image: url("km.mp3.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .full-wrapper {
      width: 100%;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
    }

    .page { 
      display: none; 
      width: 100%;
      max-width: 1200px;
    }
    .active { display: block; }

    h1 {
      color: #fff;
      font-size: 52px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }

    h2 {
      color: #ff80ab;
      font-size: 36px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
      margin-bottom: 20px;
    }

    p {
      color: #ffffff;
      font-size: 22px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      margin: 15px 0;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin: 30px auto;
      width: 90%;
    }
    .photo-grid img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      object-position: top center;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 15px;
      margin: 30px auto 10px;
      max-height: 520px;
      overflow-y: auto;
      padding: 15px;
      width: 95%;
    }
    .gift-box {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 20px 10px;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s, background 0.2s;
    }
    .gift-box:hover { 
      transform: scale(1.1); 
      background: #ff4081;
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 550px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    .modal-content video {
      width: 100%;
      max-height: 320px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    button {
      padding: 16px 40px;
      border: none;
      border-radius: 35px;
      background: #ff4081;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(255, 64, 129, 0.5);
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.08); }

    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1c1c1c;
      color: #ff4081;
      border: 2px solid #ff4081;
      z-index: 1000;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      h2 { font-size: 26px; }
      p { font-size: 18px; }
      .gift-grid { grid-template-columns: repeat(4, 1fr); }
      .photo-grid img { height: 180px; }
    }
  </style>
</head>
<body>

  <button class="music-btn" onclick="playMusic()" id="btnMusic">🎵 Play Song</button>

  <audio id="bgSong" loop style="display:none;">
    <source src="kavaya.mp3" type="audio/mpeg">
  </audio>

  <div class="full-wrapper">
    
    <!-- PAGE 1: Birthday Wish & Photos -->
    <div class="page active" id="page1">
      <h1>🎂 Happy Birthday! 🎉</h1>
      <h2>Kavya Mam ❤️</h2>
      
      <div class="photo-grid">
        <img src="km.mp3.jpg" alt="Pic 1">
        <img src="kmp.mp3.jpg" alt="Pic 2">
        <img src="kmp4.mp3.jpg" alt="Pic 3">
      </div>

      <p>Wishing you endless happiness, health, and success on your special day! ✨</p>
      <button onclick="nextPage(2)">Next: Video Song 🎥</button>
    </div>

    <!-- PAGE 2: Video -->
    <div class="page" id="page2">
      <h1>Special Video 🎬</h1>
      <p style="margin-bottom: 20px;">A sweet memory created for you!</p>
      
      <video controls width="100%" style="border-radius: 20px; max-height: 500px; max-width: 900px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <source src="kms.mp4" type="video/mp4">
        Your browser does not support video.
      </video>

      <br>
      <button onclick="nextPage(3)">Next: 28 Gifts Surprise 🎁</button>
    </div>

    <!-- PAGE 3: 28 Gift Boxes -->
    <div class="page" id="page3">
      <h1>28 Birthday Gifts 🎁</h1>
      <p>Click any box to watch your video surprise & message!</p>
      
      <div class="gift-grid" id="giftGrid"></div>

      <button onclick="nextPage(1)">Start Again 🔄</button>
    </div>

  </div>

  <!-- Popup Modal for Gift Videos -->
  <div class="modal" id="giftModal">
    <div class="modal-content">
      <video id="modalVideo" controls autoplay style="width: 100%;">
        <source id="videoSource" src="" type="video/mp4">
        Your browser does not support video.
      </video>
      <p id="modalText" style="color: #333; font-weight: bold; font-size: 18px; margin-bottom: 10px;"></p>
      <button onclick="closeModal()" style="padding: 10px 30px; font-size: 16px; margin-top: 5px;">Close ❌</button>
    </div>
  </div>

  <script>
    function nextPage(pageNumber) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page' + pageNumber).classList.add('active');
    }

    function playMusic() {
      const song = document.getElementById("bgSong");
      const btn = document.getElementById("btnMusic");
      if (song.paused) {
        song.play();
        btn.innerHTML = "⏸️ Pause";
      } else {
        song.pause();
        btn.innerHTML = "🎵 Play Song";
      }
    }

    const giftMessages = [
      "1. You inspire us every single day! 🌸",
      "2. Best Teacher ever! 📚",
      "3. Thank you for your endless guidance! ❤️",
      "4. Stay blessed and happy always! ✨",
      "5. May your year be full of joy! 🥳",
      "6. Always keep smiling! 😊",
      "7. You are a true light in our lives! 🌟",
      "8. Wishing you health and success! 🏆",
      "9. Thank you for your patience! 💐",
      "10. Happy Birthday Kavya Mam! 🎂",
      "11. Best wishes on your birthday! 🎉",
      "12. You make learning so fun! ✏️",
      "13. Forever grateful for you! 🙏",
      "14. Hope all your wishes come true! 🌈",
      "15. Brightest star of our class! ⭐",
      "16. Enjoy your special day! 🎁",
      "17. Keep shining bright! 💖",
      "18. Thank you for always believing in us! 🤗",
      "19. Super Mam! 🦸‍♀️",
      "20. Best memories with you! 📸",
      "21. Wishing you peace & laughter! 😄",
      "22. Lots of love on your birthday! 💕",
      "23. Wonderful teacher & friend! 🌼",
      "24. May today be unforgettable! 🎈",
      "25. Celebrating YOU today! 🥂",
      "26. Always stay positive! 🌺",
      "27. Thank you for being awesome! 🔥",
      "28. Happy Birthday Kavya Mam! ❤️🎂"
    ];

    /* ప్రతి బాక్స్ వీడియో ఫైల్స్ ఇక్కడ సెట్ చేయవచ్చు (ఉదాహరణకి 1.mp4, 2.mp4... లేదా kms.mp4) */
    const giftVideos = Array.from({length: 28}, (_, i) => `${i + 1}.mp4`);

    const grid = document.getElementById("giftGrid");
    for (let i = 1; i <= 28; i++) {
      const box = document.createElement("div");
      box.className = "gift-box";
      box.innerHTML = "🎁<br><span style='font-size:14px; font-weight:bold;'>#" + i + "</span>";
      box.onclick = () => openGift(i);
      grid.appendChild(box);
    }

    function openGift(num) {
      const modalVideo = document.getElementById("modalVideo");
      const videoSource = document.getElementById("videoSource");
      
      // గిఫ్ట్ వీడియో పాత్ సెట్ చేయడం
      videoSource.src = giftVideos[num - 1];
      modalVideo.load();
      
      document.getElementById("modalText").innerText = giftMessages[num - 1];
      document.getElementById("giftModal").style.display = "flex";
    }

    function closeModal() {
      const modalVideo = document.getElementById("modalVideo");
      modalVideo.pause(); // మోడల్ క్లోజ్ అయినప్పుడు వీడియో ఆగిపోతుంది
      document.getElementById("giftModal").style.display = "none";
    }
  </script>

</body>
</html>
