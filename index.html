<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kavya Akka!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: radial-gradient(circle at center, #3b0a45 0%, #110216 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .page { display: none; width: 100%; max-width: 800px; padding: 20px; }
    .active { display: block !important; }

    h1 {
      font-size: 32px;
      color: #ff71ce;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #ff9ebb;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 35px;
      border: none;
      border-radius: 35px;
      background: linear-gradient(45deg, #ff71ce, #ff4081);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(255, 113, 206, 0.5);
    }
    button:hover { transform: scale(1.05); }

    .box {
      background: rgba(255, 255, 255, 0.07);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 182, 193, 0.3);
    }
  </style>
</head>
<body>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div class="box">
      <h1>Something special is waiting for you...</h1>
      <button onclick="nextPage(2)">Celebrate Her Day ❤️</button>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <div class="box">
      <h1>🎉 Happy Birthday Kavya Akka! 🎉</h1>
      <p>Wishing You A Life Full Of Happiness & Smiles ❤️✨</p>
      <button onclick="nextPage(3)">Next Page 🎁</button>
    </div>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <div class="box">
      <h1>All Success & Joy Always! ✨</h1>
      <button onclick="nextPage(1)">Restart 🔄</button>
    </div>
  </div>

  <script>
    function nextPage(num) {
      console.log("Moving to page: " + num);
      var pages = document.querySelectorAll('.page');
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove('active');
      }
      var target = document.getElementById('page' + num);
      if (target) {
        target.classList.add('active');
        window.scrollTo(0, 0);
      }
    }
  </script>

</body>
</html>
