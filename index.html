<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch / Draw Reveal Effect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    h2 {
      margin-bottom: 10px;
      color: #38bdf8;
      text-align: center;
    }

    p {
      margin-bottom: 20px;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
    }

    /* Container for Canvas and Image */
    .scratch-container {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 3px solid #334155;
    }

    /* Kindha unde Hidden Image */
    .hidden-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      user-select: none;
    }

    /* Paina Draw chese Canvas Layer */
    #scratchCanvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      touch-action: none; /* Mobile swipe/touch glitch avvakunda untundhi */
    }
  </style>
</head>
<body>

  <h2>Scratch & Reveal</h2>
  <p>Mee hand/finger తో screen పైన రుద్దండి (Draw చేయండి)</p>

  <div class="scratch-container">
    <!-- 1. Kindha unde Image (Mee image link ni ikkada replace cheyandi) -->
    <img src="https://picsum.photos/400/400" alt="Hidden Surprise" class="hidden-image">
    
    <!-- 2. Paina Draw chese Canvas -->
    <canvas id="scratchCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas Size Set Cheyadam
    const width = 320;
    const height = 320;
    canvas.width = width;
    canvas.height = height;

    // Paina Grey Cover Page Fill Cheyadam
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, 0, width, height);

    // Text Overlay (Guide text)
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('👆 Draw / Scratch Here', width / 2, height / 2);

    let isDrawing = false;

    // Drawing / Erasing Function
    function scratch(e) {
      if (!isDrawing) return;

      const rect = canvas.getBoundingClientRect();
      
      // Touch and Mouse X, Y Coordinates
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const x = clientX - rect.left;
      const y = clientY - rect.top;

      // Erase / Transparent effect
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 25, 0, Math.PI * 2); // 25 = Brush Size
      ctx.fill();
    }

    // Mouse Events (Laptop / Desktop)
    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);

    // Touch Events (Mobile Finger Gesture)
    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      scratch(e);
    });
    canvas.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('touchmove', scratch);
  </script>

</body>
</html>
