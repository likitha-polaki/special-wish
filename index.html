<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Kavya Akka! 🎉</title>
    <!-- Google Fonts & Confetti CDN -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1e052d, #080112);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Dynamic Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 8px 32px 0 rgba(236, 72, 153, 0.37);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            width: 100%;
            max-width: 600px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* Neon Animated Title */
        .neon-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 80px #ff1493;
            animation: pulseGlow 2s infinite alternate;
            margin-bottom: 10px;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4; }
            100% { text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 60px #ff1493; }
        }

        .cursive-sub {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #ffb6c1;
        }

        /* Interactive Buttons */
        .btn-magic {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-magic:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.9);
        }

        /* 3D Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .photo-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.5s;
        }

        .photo-card img:hover {
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 15px 30px rgba(255, 105, 180, 0.8);
        }

        /* Candle & Flame Styling */
        .candle-container {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candle {
            width: 35px;
            height: 100px;
            background: linear-gradient(to bottom, #ff9a9e, #fecfef);
            border-radius: 10px 10px 0 0;
            position: relative;
        }

        .flame {
            width: 20px;
            height: 30px;
            background: orange;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #ff0, 0 0 40px #f00;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        /* Background Floating Hearts Particle Effect */
        .heart {
            position: fixed;
            color: #ff69b4;
            font-size: 20px;
            top: -10vh;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Section 1: Main Birthday Wish -->
    <div class="glass-card">
        <p class="cursive-sub">Something Special For You...</p>
        <h1 class="neon-title">Happy Birthday Kavya Akka! 🎉</h1>
        <p>You bring so much joy and sweetness into our lives!</p>
        <button class="btn-magic" onclick="triggerBlast()">Celebrate Now! 🎂</button>
    </div>

    <!-- Section 2: Sweet Memories Gallery -->
    <div class="glass-card">
        <h2>📸 Sweet Memories</h2>
        <div class="photo-grid">
            <div class="photo-card"><img src="https://picsum.photos/200/200?random=1" alt="Photo 1"></div>
            <div class="photo-card"><img src="https://picsum.photos/200/200?random=2" alt="Photo 2"></div>
            <div class="photo-card"><img src="https://picsum.photos/200/200?random=3" alt="Photo 3"></div>
        </div>
    </div>

    <!-- Section 3: Candle Blow Surprise (Mic Integration) -->
    <div class="glass-card">
        <h2>🎂 Make A Magical Wish</h2>
        <p id="mic-status">Mic enable chesi candle ki blow (uuu ani udandi) cheyandi!</p>
        
        <div class="candle-container">
            <div class="candle">
                <div class="flame" id="flame"></div>
            </div>
        </div>

        <button class="btn-magic" onclick="startMicBlow()">Mic Start Cheyandi 🎤</button>
    </div>

    <!-- Section 4: Virtual Gift Grid -->
    <div class="glass-card">
        <h2>🎁 Surprise Gifts</h2>
        <p>Click a gift box for a special message!</p>
        <button class="btn-magic" onclick="openGift()">Open Gift 🎁</button>
    </div>

    <script>
        // Universal Confetti Blast Function
        function triggerBlast() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // Floating Hearts Background Animation
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);

        // Candle Blow Sensor using Web Audio API
        function startMicBlow() {
            const micStatus = document.getElementById('mic-status');
            const flame = document.getElementById('flame');

            navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                micStatus.innerText = "Listening... Eppo Candle Blow Cheyandi! 🌬️";
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / dataArray.length;

                    // Blow Sound Threshold Limit
                    if (average > 35) {
                        flame.style.display = 'none'; // Candle off
                        micStatus.innerText = "Wish Granted! 🎉 Candle Off Ayyindi!";
                        triggerBlast(); // Grand Blast Confetti
                    } else {
                        requestAnimationFrame(checkVolume);
                    }
                }
                checkVolume();
            })
            .catch(err => {
                micStatus.innerText = "Mic Permission Denied! Candle Click Chesi Aarpandi.";
                flame.style.cursor = 'pointer';
                flame.onclick = () => {
                    flame.style.display = 'none';
                    triggerBlast();
                };
            });
        }

        // Open Gift Alert
        function openGift() {
            triggerBlast();
            alert("💖 Kavya Akka! You are the best sister ever! Stay happy always!");
        }
    </script>
</body>
</html>
